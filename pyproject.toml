[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskguard115"
version = "0.1.0"
description = "115RiskGuard — локальный инструмент анализа банковских выписок на предмет риска блокировки по 115-ФЗ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "115RiskGuard contributors" },
]
dependencies = [
    "streamlit>=1.32",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "catboost>=1.2",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "pdfplumber>=0.10",
    "python-dateutil>=2.9",
    "plotly>=5.18",
    "fpdf2>=2.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
